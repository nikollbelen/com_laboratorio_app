<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Molino SAG — Laboratorio 3D</title>

  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap">

  <!-- Estilos globales (sistema de idiomas, layout base) -->
  <link rel="stylesheet" href="./css/main.css" />

  <!-- Estilos de componentes (modales, ayudas, preloader, etc.) -->
  <link rel="stylesheet" href="./css/components/Componentes.css" />

  <!-- Estilos del menú lateral -->
  <link rel="stylesheet" href="./js/components/MenuLateral/MenuLateral.css" />
</head>
<body class="lang-es">

  <!-- =============================================
       CAPA 1: Motor 3D (Verge3D en iframe)
       ============================================= -->
  <iframe
    id="v3d-container"
    title="Laboratorio 3D"
    style="position:fixed; top:0; left:0; width:100%; height:100%; border:none; z-index:1;"
  ></iframe>

  <!-- =============================================
       CAPA 2: UI Overlay (pointer-events: none)
       Los contenedores internos activan sus propios eventos
       ============================================= -->
  <div id="ui-overlay">

    <!-- Preloader -->
    <div id="preloader-container"></div>

    <!-- Menú lateral -->
    <div id="menu-container" style="display:none;"></div>

    <!-- Botones flotantes de ayuda (abajo-derecha) -->
    <div id="ayudas-container" style="display:none;"></div>

    <!-- Botón retroceso -->
    <div id="retroceso-container"></div>

    <!-- Pantalla aviso mobile -->
    <div id="mobile-container"></div>

    <!-- Modales -->
    <div id="modal-ayuda-container"></div>
    <div id="modal-objetivos-container"></div>
    <div id="modal-equipo-container"></div>

  </div>

  <!-- Input oculto de estado (compatibilidad con visual_logic.js) -->
  <input id="estado_animacion" value="0" style="display:none;" />
  <span id="loading_percentage" style="display:none;">0%</span>

  <!-- Script principal (ES6 Module) -->
  <script type="module" src="./js/main.js"></script>
</body>
</html>
