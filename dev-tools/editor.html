<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Editor Pro | D3 Visual Configurator</title>
    <link rel="stylesheet" href="css/editor.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
    <header class="toolbar">
        <strong>Lab Editor <small>D3.js Tree Configurator</small></strong>
        <div class="controls">
            <input type="file" id="jsonFileInput" style="display: none;" accept=".json">
            <button id="uploadBtn">Subir JSON</button>
            <button id="btn-export" class="primary">Download JSON</button>
            <button id="btn-reset">Reset Vista</button>
            <button id="btn-fit">Ajustar Árbol</button>
        </div>
    </header>

    <main id="editor-layout">
        <div id="chart"></div>
    </main>

    <!-- MODAL DE EDICIÓN (BOMBA GEHO STYLE) -->
    <div id="editModalOverlay" class="modal-overlay">
        <div class="modal">
            <h3>Editar Nodo</h3>
            <div class="modal-body-layout">
                <div class="col-left">
                    <!-- CAMPOS PARA EL NODO RAÍZ (LABORATORIO) -->
                    <div id="root-fields" style="display: none;">
                        <h4>Configuración Global del Laboratorio</h4>
                        <div class="form-grid">
                            <div class="form-group"> <label>Nombre (ESP)</label> <input type="text" id="inpLabName" /> </div>
                            <div class="form-group"> <label>Nombre (ENG)</label> <input type="text" id="inpLabNameEN" /> </div>
                            
                            <!-- CONFIGURACIÓN DE FONDO -->
                            <div class="form-group">
                                <label>Tipo de Fondo</label>
                                <select id="inpBgType" style="padding: 8px; border-radius: 4px; border: 1px solid #cbd5e1; width:100%;">
                                    <option value="image">Imagen de fondo</option>
                                    <option value="color">Color sólido</option>
                                </select>
                            </div>
                            <div class="form-group" id="group-bg-color" style="display:none;">
                                <label>Color de fondo (HEX)</label>
                                <input type="color" id="inpBgColor" style="height: 38px; padding: 2px; width:100%;" />
                            </div>
                            <div class="form-group">
                                <label>Color de Tema Principal</label>
                                <input type="color" id="inpThemeColor" style="height: 38px; padding: 2px; width:100%;" value="#08a7ff" />
                            </div>
                            <div class="form-group full-width" id="group-bg-image">
                                <label>URL Imagen Fondo</label>
                                <input type="text" id="inpImageUrl" placeholder="assets/img/fondo.jpg" />
                                <div id="preview-image" style="margin-top:10px; max-height:80px; overflow:hidden; border-radius:4px; border:1px solid #eee; display:none;">
                                    <img src="" style="width:100%; object-fit:cover;" />
                                </div>
                            </div>
                            <div class="form-group">
                                <label>URL Logo</label>
                                <input type="text" id="inpLogoUrl" placeholder="assets/img/logo.png" />
                                <div id="preview-logo" style="margin-top:10px; height:40px; display:none; background:#f1f5f9; padding:5px; border-radius:4px; text-align:center;">
                                    <img src="" style="height:100%; object-fit:contain;" />
                                </div>
                            </div>
                            
                            <div class="form-group full-width">
                                <label>Configuración de Ayudas (Visibilidad)</label>
                                <div class="checkbox-container">
                                    <div class="checkbox-group"> <input type="checkbox" id="inpAyuda"> <label for="inpAyuda">Ayuda</label> </div>
                                    <div class="checkbox-group"> <input type="checkbox" id="inpObjetivos"> <label for="inpObjetivos">Objetivos</label> </div>
                                    <div class="checkbox-group"> <input type="checkbox" id="inpEquipo"> <label for="inpEquipo">Equipo</label> </div>
                                    <div class="checkbox-group"> <input type="checkbox" id="inpSonido"> <label for="inpSonido">Sonido</label> </div>
                                    <div class="checkbox-group"> <input type="checkbox" id="inpLang"> <label for="inpLang">Idioma</label> </div>
                                </div>
                            </div>

                            <div class="form-group full-width">
                                <label>Estado Inicial (Laboratorio)</label>
                                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                                    <div class="form-group">
                                        <label>Cámara Posición</label>
                                        <input type="text" id="inpInitCam" placeholder="Cam_Pos_01" />
                                    </div>
                                    <div class="form-group">
                                        <label>Cámara Dirección</label>
                                        <input type="text" id="inpInitDir" placeholder="Cam_Dir_01" />
                                    </div>
                                </div>
                                
                                <div style="margin-top:15px; padding: 10px; background: #f1f5f9; border-radius: 4px;">
                                    <label style="color:#1e293b; font-weight: bold;">1. Visibilidad Inicial</label>
                                    <div style="margin-top:10px;">
                                        <label>Objetos a Ocultar al Inicio (IDs)</label>
                                        <div class="tag-input-container">
                                            <input type="text" id="inpInitOcultar" placeholder="Escribe ID y pulsa +">
                                            <button type="button" class="btn-add-tag" onclick="addTagFromInput('inpInitOcultar', 'tags-init-ocultar')">+</button>
                                        </div>
                                        <div id="tags-init-ocultar" class="tags-display"></div>
                                    </div>
                                </div>

                                <div style="margin-top:15px; padding: 10px; background: #f0fdf4; border-radius: 4px; border: 1px solid #dcfce7;">
                                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                                        <label style="color:#166534; font-weight: bold; margin:0;">2. Secuencias de Animación Inicial</label>
                                        <button type="button" class="btn-add-mini" onclick="addAnimRow('root')">+</button>
                                    </div>
                                    <div id="root-anim-list" class="anim-rows-container"></div>
                                </div>

                                <!-- SECCIÓN OBJETIVOS -->
                                <div id="section-objetivos" style="margin-top:15px; padding: 10px; background: #fff7ed; border-radius: 4px; border: 1px solid #ffedd5;">
                                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                                        <label style="color:#9a3412; font-weight: bold; margin:0;">3. Objetivos del Laboratorio</label>
                                        <button type="button" class="btn-add-mini" style="background:#f97316" onclick="addRow('objetivo')">+</button>
                                    </div>
                                    <div id="list-objetivos" class="anim-rows-container"></div>
                                </div>

                                <!-- SECCIÓN EPP -->
                                <div id="section-epp" style="margin-top:15px; padding: 10px; background: #fdf2f8; border-radius: 4px; border: 1px solid #fce7f3;">
                                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                                        <label style="color:#9d174d; font-weight: bold; margin:0;">4. Equipo de Protección (EPP)</label>
                                        <button type="button" class="btn-add-mini" style="background:#db2777" onclick="addRow('epp')">+</button>
                                    </div>
                                    <div id="list-epp" class="anim-rows-container"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- CAMPOS PARA LOS PASOS -->
                    <div id="step-fields">
                        <h4>Propiedades del Paso / Componente</h4>
                        <div class="form-grid">
                            <div class="form-group full-width"> 
                                <label>Nombre (Locución en Español)</label> 
                                <div style="display: flex; gap: 8px; align-items: center;">
                                    <input type="text" id="inpNombre" placeholder="Ej: Vista Explosión" style="flex: 1;" />
                                    <button type="button" id="btnPlayTTS" class="btn-audio-action" title="Reproducir audio (Escuchar cómo suena)" onclick="playCurrentTTS()">▶️</button>
                                    <button type="button" id="btnRegenerateTTS" class="btn-audio-action" title="Regenerar locución (Usar ElevenLabs)" style="background: #ef4444;" onclick="confirmAndRegenerateTTS()">🎙️</button>
                                </div>
                            </div>
                            <div class="form-group"> <label>Etiqueta / ID</label> <input type="text" id="inpEtiqueta" placeholder="Ej: etiquetaPosObj" /> </div>
                            <div class="form-group"> <label>Posición (Cámara)</label> <input type="text" id="inpPosicion" placeholder="COORDENADA_POS" /> </div>
                            <div class="form-group"> <label>Dirección (Cámara)</label> <input type="text" id="inpDireccion" placeholder="COORDENADA_DIR" /> </div>
                            
                            <div class="form-group full-width" style="margin-top: 10px; border-top: 1px solid #eee; padding-top: 10px;">
                                <label style="cursor:pointer; display:flex; align-items:center; gap:8px;">
                                    <input type="checkbox" id="chkEsEtiqueta" onchange="toggleEtiquetaSection()"> 
                                    <b>¿Es una Anotación / Etiqueta?</b>
                                </label>
                            </div>

                            <div id="section-etiqueta" style="display: none; grid-column: span 2;" class="form-grid">
                                <div class="form-group"> <label>ID Objeto Etiqueta</label> <input type="text" id="inpEtiquetaObj" placeholder="Ej: etiqueta_mesh" /> </div>
                                <div class="form-group"> <label>ID Objeto Flecha</label> <input type="text" id="inpFlechaObj" placeholder="Ej: flecha_mesh" /> </div>
                            </div>

                            <div class="form-group full-width">
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                                    <label style="font-weight: bold; margin:0;">Control de Animaciones del Paso</label>
                                    <button type="button" class="btn-add-mini" onclick="addAnimRow('step')">+</button>
                                </div>
                                <div id="step-anim-list" class="anim-rows-container"></div>
                            </div>

                            <div class="form-group"> <label><input type="checkbox" id="inpStopAnim"> Detener Animaciones</label> </div>
                            
                            <div class="form-group full-width">
                                <label>Objetos a Ocultar (IDs)</label>
                                <div class="tag-input-container">
                                    <input type="text" id="inpOcultarTxt" placeholder="Escribe ID y pulsa +">
                                    <button type="button" class="btn-add-tag" onclick="addTagFromInput('inpOcultarTxt', 'tags-ocultar')">+</button>
                                </div>
                                <div id="tags-ocultar" class="tags-display"></div>
                            </div>

                            <div class="form-group full-width">
                                <label>Objetos a Resaltar (IDs)</label>
                                <div class="tag-input-container">
                                    <input type="text" id="inpResaltarTxt" placeholder="Escribe ID y pulsa +">
                                    <button type="button" class="btn-add-tag" onclick="addTagFromInput('inpResaltarTxt', 'tags-resaltar')">+</button>
                                </div>
                                <div id="tags-resaltar" class="tags-display"></div>
                            </div>
                            <div id="tts-status" style="margin-top: 4px; font-size: 0.8em; color: #64748b; text-align: right;"></div>
                            <input type="hidden" id="inpAudioPath">
                        </div>
                    </div>
                </div>

                <div class="col-right">
                    <h4>Estructura de Hijos</h4>
                    <div id="childrenListContainer" class="children-list"></div>
                    <button class="btn-add-child" onclick="addNewChild()">+ Agregar Sub-paso</button>
                </div>
            </div> <!-- Fin de modal-body-layout -->

            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
                <button class="btn-save" onclick="saveNodeChanges()">Guardar Cambios</button>
            </div>
        </div>
    </div>

    <!-- MODAL DE CONFIRMACIÓN PERSONALIZADO -->
    <div id="confirmModalOverlay" class="modal-overlay" style="display: none; z-index: 2000; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(4px);">
        <div class="modal-content" style="max-width: 450px; background: white; border: 1px solid #334155; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); overflow: hidden;">
            <div class="modal-header" style="background: #f8fafc; border-bottom: 1px solid #e2e8f0; padding: 15px 20px;">
                <h3 id="confirmTitle" style="margin: 0; color: #0f172a; font-size: 1.1em; font-weight: 700;">Confirmar Acción</h3>
            </div>
            <div id="confirmMessage" class="modal-body" style="padding: 25px 20px; color: #1e293b; line-height: 1.6; font-size: 1em;">
                <!-- Mensaje dinámico -->
            </div>
            <div class="modal-footer" style="background: #f1f5f9; border-top: 1px solid #e2e8f0; padding: 12px 20px; display: flex; gap: 10px; justify-content: flex-end;">
                <button id="btnConfirmCancel" class="btn-cancel" style="background: white; border: 1px solid #cbd5e1; color: #64748b; margin: 0; padding: 8px 16px;">Cancelar</button>
                <button id="btnConfirmOk" class="btn-save" style="background: #3874ff; margin: 0; padding: 8px 20px; font-weight: 600;">Confirmar</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/editor-ui.js"></script>
</body>
</html>
